name: Sync Upstream
on:
  schedule:
    # 每天北京时间凌晨 3:00 自动同步
    - cron: '0 19 * * *'
  # 允许手动点击按钮立即同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 必须显式使用你的 token，否则原生 git 没有写入权限
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Force Push
        run: |
          # 1. 配置临时电脑的身份信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. 把原作者的仓库添加为远程源，命名为 upstream
          git remote add upstream https://github.com/bia-pain-bache/BPB-Worker-Panel.git
          
          # 3. 抓取原作者的最新代码
          git fetch upstream main
          
          # 4. 把你本地的 main 分支，强行重置到和原作者一模一样的状态
          git checkout main
          git reset --hard upstream/main
          
          # 5. 暴力强推到你自己的 GitHub 仓库，抹平所有差异
          git push origin main --force
